
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport"
        content="width=device-width, initial-scale=1">
  <meta name="description"
        content="Aashish Rahate - Software and AI Engineer">
  <title>Aashish Rahate | Portfolio</title>

  <style>
    * { box-sizing: border-box; }

    body {
      margin: 0;
      min-height: 100vh;
      display: grid;
      place-items: center;
      padding: 24px;
      background: #0b1120;
      color: #f8fafc;
      font-family: system-ui, sans-serif;
    }

    main { max-width: 750px; }

    h1 {
      font-size: clamp(2.5rem, 7vw, 4.5rem);
      line-height: 1.1;
      margin: 18px 0;
    }

    p {
      color: #cbd5e1;
      line-height: 1.8;
      font-size: 1.1rem;
    }

    .tag { color: #67e8f9; }

    a {
      display: inline-block;
      color: #0b1120;
      background: #67e8f9;
      padding: 12px 20px;
      margin: 12px 12px 0 0;
      text-decoration: none;
      border-radius: 8px;
      font-weight: 600;
    }

    a:hover { background: #a5f3fc; }
    a:focus-visible {
      outline: 3px solid white;
      outline-offset: 3px;
    }
  </style>
</head>
<body>
  <main>
    <strong class="tag">SOFTWARE & AI ENGINEERING</strong>

    <h1>Hi, I'm Aashish.</h1>

    <p>
      I'm a software engineer and graduate student
      at Georgia Tech, focusing on AI systems,
      machine learning, and distributed computing.
    </p>

    <p>
      I enjoy building production-ready systems
      and solving complex engineering problems.
    </p>

    <a href="https://github.com/ashishrahate">
      GitHub
    </a>
    <a href="https://www.linkedin.com/aashish-rahate">
      LinkedIn
    </a>
  </main>
</body>
</html>
